name: Publish Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# id-token: write lets GitHub issue the short-lived OIDC token that your
# federated credential trusts. contents: read is the least-privilege default
# needed to check out the repo.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: npx vsce publish --skip-duplicate --azure-credential
